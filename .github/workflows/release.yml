name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Validate release tag and changelog
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ruby -r ./lib/gem_toys/version -e '
            version = GemToys::VERSION
            abort "Tag does not match gem version" unless ENV.fetch("RELEASE_TAG") == "v#{version}"
            heading = /^## #{Regexp.escape(version)} \(\d{4}-\d{2}-\d{2}\)$/
            abort "Missing dated changelog entry" unless File.read("CHANGELOG.md").match?(heading)
          '
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec bundle-audit check --update
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - run: npm install
      - run: npm run remark
      - run: bundle exec toys gem build

  publish:
    if: github.event_name == 'push' && github.repository == 'AlexWayfer/gem_toys'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec toys gem build
      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push pkg/*.gem
